<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAGED & Scale Guitar Trainer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --bg-color: #ffffff;
      --card-bg: #f8fafc;
      --border-color: #e2e8f0;
      --text-color: #1e293b;
      --accent-color: #2563eb;
      --root-color: #ef4444;       /* Rosso Tonica Accordo */
      --chord-color: #f59e0b;      /* Arancione 3a, 5a, 7a */
      --scale-color: #10b981;      /* Verde Note Scala */
      --blue-note-color: #0284c7;  /* Blu Blue Note */
      --fret-color: #94a3b8;
      --string-color: #64748b;
    }

    body.dark-mode {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-color: #f8fafc;
      --fret-color: #64748b;
      --string-color: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s, color 0.3s;
    }

    h1 { font-size: 1.3rem; margin-bottom: 10px; text-align: center; }

    /* Navigazione a 4 Schede */
    .tab-nav {
      display: flex;
      width: 100%;
      max-width: 500px;
      margin-bottom: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 2px;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-weight: bold;
      font-size: 0.78rem;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #ffffff;
    }

    .tab-content {
      display: none;
      width: 100%;
      max-width: 500px;
    }

    .tab-content.active { display: block; }

    /* Box Sintesi Accordo */
    .chord-summary-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-color);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      color: var(--text-color);
    }

    .controls {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .control-group { display: flex; flex-direction: column; }
    .control-group.full { grid-column: span 2; }

    label { font-size: 0.75rem; margin-bottom: 3px; font-weight: bold; opacity: 0.8; }
    
    select, button.action-btn {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }

    /* Toggle Bar */
    .toggle-bar {
      display: flex;
      gap: 6px;
      grid-column: span 2;
    }

    .toggle-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: bold;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
    }

    /* Contenitore con scorrimento orizzontale forzato e isolato */
    .fretboard-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px 8px;
      border-radius: 10px;
      width: 100%;
      overflow-x: auto !important;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .fretboard {
      display: grid;
      grid-template-columns: 30px repeat(5, 1fr);
      user-select: none;
    }

    /* RISOLUZIONE PROBLEMA 'A CAPO': Grid fisso a min-content con estensione rigida */
    .fretboard.full-neck {
      display: grid !important;
      width: max-content !important;
    }

    .fret-header {
      text-align: center;
      font-size: 0.75rem;
      padding-bottom: 6px;
      font-weight: bold;
      white-space: nowrap;
    }

    .string-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.85rem;
    }

    .fret-cell {
      position: relative;
      height: 40px;
      border-right: 2px solid var(--fret-color);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .fret-cell.is-nut { border-right: 4px solid var(--text-color); }

    .string-line {
      position: absolute;
      left: 0; right: 0; top: 50%;
      background-color: var(--string-color);
      transform: translateY(-50%);
      z-index: 1;
    }

    .s1 .string-line { height: 1px; }
    .s2 .string-line { height: 1.5px; }
    .s3 .string-line { height: 2px; }
    .s4 .string-line { height: 2.5px; }
    .s5 .string-line { height: 3px; }
    .s6 .string-line { height: 3.5px; }

    .note-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      font-weight: bold;
      color: #fff;
      z-index: 2;
    }

    .note-root { background-color: var(--root-color); color: #fff; }
    .note-chord { background-color: var(--chord-color); color: #000; }
    .note-scale { background-color: var(--scale-color); color: #000; }
    .note-blue { background-color: var(--blue-note-color); color: #fff; }

    /* Quiz Card */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .quiz-target {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <h1>CAGED & Scale Trainer</h1>

  <!-- Navigazione a 4 Schede -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab(event, 'tab-practice')">Studio</button>
    <button class="tab-btn" onclick="switchTab(event, 'tab-full')">Manico</button>
    <button class="tab-btn" onclick="switchTab(event, 'tab-quiz')">Quiz</button>
    <button class="tab-btn" onclick="switchTab(event, 'tab-settings')">Opzioni</button>
  </div>

  <!-- TAB 1: STUDIO (BOX A 4 TASTI) -->
  <div id="tab-practice" class="tab-content active">
    
    <!-- Box Sintesi Accordo Selezionato -->
    <div class="chord-summary-box" id="chord-summary-box">
      Accordo: C = C - E - G
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="root-select">Tonalità Maggiore</label>
        <select id="root-select"></select>
      </div>

      <div class="control-group">
        <label for="scale-select">Tipo Scala / Modo / Arpeggio</label>
        <select id="scale-select">
          <optgroup label="Scale Principali">
            <option value="major" selected>Scala Maggiore</option>
            <option value="pentatonic_major">Pentatonica Maggiore</option>
          </optgroup>
          <optgroup label="Modi Greci">
            <option value="mode_ionian">Ionio (I°)</option>
            <option value="mode_dorian">Dorico (ii°)</option>
            <option value="mode_phrygian">Frigio (iii°)</option>
            <option value="mode_lydian">Lidio (IV°)</option>
            <option value="mode_mixolydian">Misolidio (V°)</option>
            <option value="mode_aeolian">Eolio (vi° - Min. Nat.)</option>
            <option value="mode_locrian">Locrio (vii°)</option>
          </optgroup>
          <optgroup label="Arpeggi">
            <option value="arp_chord">Arpeggio dell'Accordo Selezionato</option>
            <option value="arp_maj">Arpeggio Maggiore</option>
            <option value="arp_min">Arpeggio Minore</option>
            <option value="arp_maj7">Arpeggio Maj7</option>
            <option value="arp_dom7">Arpeggio Dominante 7</option>
            <option value="arp_m7">Arpeggio m7</option>
          </optgroup>
        </select>
      </div>

      <div class="control-group">
        <label for="caged-select">Forma CAGED</label>
        <select id="caged-select">
          <option value="C">Forma C</option>
          <option value="A">Forma A</option>
          <option value="G">Forma G</option>
          <option value="E" selected>Forma E</option>
          <option value="D">Forma D</option>
        </select>
      </div>

      <div class="control-group">
        <label for="chord-select">Accordo da Evidenziare</label>
        <select id="chord-select"></select>
      </div>

      <div class="toggle-bar">
        <button class="toggle-btn" id="btn-root-only" onclick="toggleOption('rootOnly')">Solo Toniche</button>
        <button class="toggle-btn" id="btn-blue-note" onclick="toggleOption('blueNote')">+ Blue Note</button>
        <button class="toggle-btn" id="btn-accidental" onclick="toggleOption('useFlats')">Notazione ♭</button>
      </div>
    </div>

    <div class="fretboard-container">
      <div class="fretboard" id="fretboard-box"></div>
    </div>
  </div>

  <!-- TAB 2: MANICO COMPLETO -->
  <div id="tab-full" class="tab-content">
    <div class="fretboard-container">
      <div class="fretboard full-neck" id="fretboard-full"></div>
    </div>
  </div>

  <!-- TAB 3: QUIZ (ALLENAMENTO) -->
  <div id="tab-quiz" class="tab-content">
    <div class="quiz-card">
      <h3>Generatore di Esercizi (Flashcard)</h3>
      <p style="font-size: 0.85rem; margin-top: 5px;">Trova subito la posizione esatta sul manico della chitarra!</p>
      <div class="quiz-target" id="quiz-target">Premi "Nuova Sfida"</div>
      <button class="action-btn" style="background: var(--accent-color); color: #fff; font-weight: bold; width: 100%;" onclick="generateQuiz()">Nuova Sfida Casual</button>
    </div>
  </div>

  <!-- TAB 4: OPZIONI & IMPOSTAZIONI -->
  <div id="tab-settings" class="tab-content">
    <div class="controls">
      <div class="control-group full">
        <label for="naming-select">Sistema di Nomenclatura Note</label>
        <select id="naming-select" onchange="changeNamingSystem(this.value)">
          <option value="INT" selected>Internazionale (C, D, E, F, G, A, B)</option>
          <option value="ITA">Italiana (DO, RE, MI, FA, SOL, LA, SI)</option>
        </select>
      </div>

      <div class="control-group full">
        <label for="seventh-chords-select">Accordi di Settima (Quadriadi)</label>
        <select id="seventh-chords-select" onchange="toggleSeventhChords(this.value)">
          <option value="off" selected>Off (Triadi a 3 note)</option>
          <option value="on">On (Quadriadi di 7a a 4 note)</option>
        </select>
      </div>

      <div class="control-group full">
        <label for="neck-length-select">Lunghezza Manico (Scheda Manico)</label>
        <select id="neck-length-select" onchange="changeNeckLength(this.value)">
          <option value="12">12 Tasti</option>
          <option value="22" selected>22 Tasti</option>
          <option value="24">24 Tasti</option>
        </select>
      </div>

      <div class="control-group full">
        <label for="tuning-select">Accordatura Strumento</label>
        <select id="tuning-select">
          <option value="Standard">Standard (E A D G B E)</option>
          <option value="Drop D">Drop D (D A D G B E)</option>
          <option value="DADGAD">DADGAD</option>
          <option value="Open G">Open G (D G D G B D)</option>
          <option value="Open D">Open D (D A D F# A D)</option>
        </select>
      </div>

      <div class="control-group full" style="margin-top: 10px;">
        <button class="action-btn" id="btn-theme" onclick="toggleDarkMode()">Attiva Tema Scuro (Dark Mode)</button>
      </div>
    </div>
  </div>

  <script>
    const NOTES_SHARP_INT = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const NOTES_FLAT_INT  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

    const NOTES_SHARP_ITA = ["DO", "DO#", "RE", "RE#", "MI", "FA", "FA#", "SOL", "SOL#", "LA", "LA#", "SI"];
    const NOTES_FLAT_ITA  = ["DO", "DOb", "RE", "REb", "MI", "FA", "FAb", "SOL", "SOLb", "LA", "LAb", "SI"];

    const ROMAN_NUMERALS = ["0", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX", "XXI", "XXII", "XXIII", "XXIV"];

    const TUNINGS = {
      "Standard": [4, 11, 7, 2, 9, 4],  // Indici cromatici assoluti: E, B, G, D, A, E
      "Drop D":   [4, 11, 7, 2, 9, 2],
      "DADGAD":   [2, 9, 7, 2, 9, 2],
      "Open G":   [2, 11, 7, 2, 7, 2],
      "Open D":   [2, 9, 6, 2, 9, 2]
    };

    const SCALE_INTERVALS = {
      "major": [0, 2, 4, 5, 7, 9, 11],
      "pentatonic_major": [0, 2, 4, 7, 9],
      "mode_ionian": [0, 2, 4, 5, 7, 9, 11],
      "mode_dorian": [0, 2, 3, 5, 7, 9, 10],
      "mode_phrygian": [0, 1, 3, 5, 7, 8, 10],
      "mode_lydian": [0, 2, 4, 6, 7, 9, 11],
      "mode_mixolydian": [0, 2, 4, 5, 7, 9, 10],
      "mode_aeolian": [0, 2, 3, 5, 7, 8, 10],
      "mode_locrian": [0, 1, 3, 5, 6, 8, 10],
      "arp_chord": null,
      "arp_maj": [0, 4, 7],
      "arp_min": [0, 3, 7],
      "arp_maj7": [0, 4, 7, 11],
      "arp_dom7": [0, 4, 7, 10],
      "arp_m7": [0, 3, 7, 10]
    };

    const MAJOR_HARMONY_TRIADS = [
      { degree: "I", type: "", semitones: 0, chordType: "maj", intervals: [0, 4, 7] },
      { degree: "ii", type: "min", semitones: 2, chordType: "min", intervals: [0, 3, 7] },
      { degree: "iii", type: "min", semitones: 4, chordType: "min", intervals: [0, 3, 7] },
      { degree: "IV", type: "", semitones: 5, chordType: "maj", intervals: [0, 4, 7] },
      { degree: "V", type: "", semitones: 7, chordType: "maj", intervals: [0, 4, 7] },
      { degree: "vi", type: "min", semitones: 9, chordType: "min", intervals: [0, 3, 7] },
      { degree: "vii°", type: "dim", semitones: 11, chordType: "dim", intervals: [0, 3, 6] }
    ];

    const MAJOR_HARMONY_SEVENTHS = [
      { degree: "I", type: "maj7", semitones: 0, chordType: "maj7", intervals: [0, 4, 7, 11] },
      { degree: "ii", type: "m7", semitones: 2, chordType: "m7", intervals: [0, 3, 7, 10] },
      { degree: "iii", type: "m7", semitones: 4, chordType: "m7", intervals: [0, 3, 7, 10] },
      { degree: "IV", type: "maj7", semitones: 5, chordType: "maj7", intervals: [0, 4, 7, 11] },
      { degree: "V", type: "7", semitones: 7, chordType: "dom7", intervals: [0, 4, 7, 10] },
      { degree: "vi", type: "m7", semitones: 9, chordType: "m7", intervals: [0, 3, 7, 10] },
      { degree: "vii°", type: "m7♭5", semitones: 11, chordType: "m7b5", intervals: [0, 3, 6, 10] }
    ];

    const CAGED_OFFSETS = {
      "E": { string: 5, offset: -1 },
      "A": { string: 4, offset: -1 },
      "D": { string: 3, offset: -1 },
      "C": { string: 4, offset: -3 },
      "G": { string: 5, offset: -3 }
    };

    let state = {
      useFlats: false,
      namingSystem: "INT",
      rootIndex: 0,
      rootOnly: false,
      blueNote: false,
      isDark: false,
      useSevenths: false,
      neckLength: 22
    };

    function getNotesArray() {
      if (state.namingSystem === "ITA") {
        return state.useFlats ? NOTES_FLAT_ITA : NOTES_SHARP_ITA;
      } else {
        return state.useFlats ? NOTES_FLAT_INT : NOTES_SHARP_INT;
      }
    }

    const rootSelect = document.getElementById("root-select");
    function populateRoots() {
      const notes = getNotesArray();
      rootSelect.innerHTML = "";
      notes.forEach((n, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = n;
        rootSelect.appendChild(opt);
      });
      rootSelect.value = state.rootIndex;
    }

    const scaleSelect = document.getElementById("scale-select");
    const cagedSelect = document.getElementById("caged-select");
    const chordSelect = document.getElementById("chord-select");
    const tuningSelect = document.getElementById("tuning-select");

    function updateChordDropdown() {
      const notes = getNotesArray();
      const prev = chordSelect.value;
      chordSelect.innerHTML = "";

      const harmonyList = state.useSevenths ? MAJOR_HARMONY_SEVENTHS : MAJOR_HARMONY_TRIADS;

      harmonyList.forEach(item => {
        const noteIdx = (state.rootIndex + item.semitones) % 12;
        const noteName = notes[noteIdx];
        const opt = document.createElement("option");
        opt.value = `${item.semitones}_${item.chordType}`;
        const chordName = item.type ? `${noteName}${item.type}` : noteName;
        opt.textContent = `${item.degree}: ${chordName}`;
        chordSelect.appendChild(opt);
      });

      if (prev && Array.from(chordSelect.options).some(o => o.value === prev)) {
        chordSelect.value = prev;
      } else {
        chordSelect.value = state.useSevenths ? "0_maj7" : "0_maj";
      }
    }

    function switchTab(evt, tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      evt.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      render();
    }

    function toggleOption(key) {
      state[key] = !state[key];
      if (key === 'useFlats') populateRoots();
      document.getElementById(`btn-${key === 'useFlats' ? 'accidental' : (key === 'rootOnly' ? 'root-only' : 'blue-note')}`).classList.toggle('active', state[key]);
      render();
    }

    function changeNamingSystem(val) {
      state.namingSystem = val;
      populateRoots();
      render();
    }

    function toggleSeventhChords(val) {
      state.useSevenths = (val === "on");
      render();
    }

    function changeNeckLength(val) {
      state.neckLength = parseInt(val, 10);
      render();
    }

    function toggleDarkMode() {
      state.isDark = !state.isDark;
      document.body.classList.toggle('dark-mode', state.isDark);
      document.getElementById('btn-theme').textContent = state.isDark ? "Attiva Tema Chiaro" : "Attiva Tema Scuro (Dark Mode)";
    }

    function generateQuiz() {
      const notes = getNotesArray();
      const forms = ["C", "A", "G", "E", "D"];
      const randomNote = notes[Math.floor(Math.random() * notes.length)];
      const randomForm = forms[Math.floor(Math.random() * forms.length)];
      document.getElementById('quiz-target').textContent = `${randomNote} Maggiore - Forma ${randomForm}`;
    }

    function render() {
      state.rootIndex = parseInt(rootSelect.value || 0, 10);
      updateChordDropdown();

      const notes = getNotesArray();
      const scaleType = scaleSelect.value;
      const cagedForm = cagedSelect.value;
      const tuningIndices = TUNINGS[tuningSelect.value];
      const selectedChordMode = chordSelect.value;

      const [offsetStr, chordType] = selectedChordMode.split("_");
      const chordOffset = parseInt(offsetStr, 10);
      const chordRootIndex = (state.rootIndex + chordOffset) % 12;
      const chordRootNote = notes[chordRootIndex];

      const harmonyList = state.useSevenths ? MAJOR_HARMONY_SEVENTHS : MAJOR_HARMONY_TRIADS;
      const currentHarmonyObj = harmonyList.find(h => h.semitones === chordOffset) || harmonyList[0];

      const chordNotesIndices = currentHarmonyObj.intervals.map(sem => (chordRootIndex + sem) % 12);
      const chordNotesNames = chordNotesIndices.map(idx => notes[idx]);

      const chordDisplayName = currentHarmonyObj.type ? `${chordRootNote}${currentHarmonyObj.type}` : chordRootNote;
      document.getElementById('chord-summary-box').textContent = `${chordDisplayName} = ${chordNotesNames.join(" - ")}`;

      let scaleIntervals = SCALE_INTERVALS[scaleType];
      let scaleNotesIndices = [];

      if (scaleType === "arp_chord") {
        scaleNotesIndices = chordNotesIndices;
      } else if (scaleIntervals) {
        scaleNotesIndices = scaleIntervals.map(i => (state.rootIndex + i) % 12);
      } else {
        scaleNotesIndices = SCALE_INTERVALS["major"].map(i => (state.rootIndex + i) % 12);
      }

      const blueNoteIndex = state.blueNote ? (state.rootIndex + 3) % 12 : null;

      const refStringOpenIndex = tuningIndices[CAGED_OFFSETS[cagedForm].string];
      let rootFret = 0;
      while (((refStringOpenIndex + rootFret) % 12) !== state.rootIndex && rootFret < 12) rootFret++;
      
      let baseFret = rootFret + CAGED_OFFSETS[cagedForm].offset;
      if (baseFret < 0) baseFret += 12;

      // Render Box 4 Tasti
      renderFretboard(document.getElementById('fretboard-box'), baseFret, 5, tuningIndices, scaleNotesIndices, blueNoteIndex, chordRootIndex, chordNotesIndices);

      // Render Manico Completo (Forzatura larghezza fissa e calcolata per evitare "a capo" su Chrome Android)
      const fullNeckEl = document.getElementById('fretboard-full');
      const fretWidth = 40;
      const labelWidth = 30;
      const totalWidth = labelWidth + ((state.neckLength + 1) * fretWidth);
      
      fullNeckEl.style.gridTemplateColumns = `${labelWidth}px repeat(${state.neckLength + 1}, ${fretWidth}px)`;
      fullNeckEl.style.width = `${totalWidth}px`;
      fullNeckEl.style.minWidth = `${totalWidth}px`;

      renderFretboard(fullNeckEl, 0, state.neckLength + 1, tuningIndices, scaleNotesIndices, blueNoteIndex, chordRootIndex, chordNotesIndices, true);
    }

    function renderFretboard(el, baseFret, numFrets, tuningIndices, scaleNotesIndices, blueNoteIndex, chordRootIndex, chordNotesIndices, isFull = false) {
      const notes = getNotesArray();
      el.innerHTML = "";
      el.appendChild(document.createElement("div"));

      for (let f = 0; f < numFrets; f++) {
        const header = document.createElement("div");
        header.className = "fret-header";
        const fNum = isFull ? f : baseFret + f;
        header.textContent = ROMAN_NUMERALS[fNum] || fNum;
        el.appendChild(header);
      }

      for (let s = 0; s < 6; s++) {
        const openNoteIndex = tuningIndices[s];
        const lbl = document.createElement("div");
        lbl.className = "string-label";
        lbl.textContent = notes[openNoteIndex];
        el.appendChild(lbl);

        for (let f = 0; f < numFrets; f++) {
          const currentFret = isFull ? f : baseFret + f;
          const noteIndex = (openNoteIndex + currentFret) % 12;
          const noteName = notes[noteIndex];

          const cell = document.createElement("div");
          cell.className = `fret-cell s${s + 1}`;
          if (currentFret === 0) cell.classList.add("is-nut");

          const line = document.createElement("div");
          line.className = "string-line";
          cell.appendChild(line);

          const isWithin = isFull || (currentFret >= baseFret && currentFret < baseFret + 4) || currentFret === 0;

          if (isWithin && (scaleNotesIndices.includes(noteIndex) || (state.blueNote && noteIndex === blueNoteIndex))) {
            const isRoot = (noteIndex === chordRootIndex);
            const isChordNote = chordNotesIndices.includes(noteIndex);
            const isBlue = (state.blueNote && noteIndex === blueNoteIndex);

            if (state.rootOnly && !isRoot) {
              el.appendChild(cell);
              continue;
            }

            const dot = document.createElement("div");
            dot.className = "note-dot";

            if (isRoot) {
              dot.classList.add("note-root");
            } else if (isChordNote) {
              dot.classList.add("note-chord");
            } else if (isBlue) {
              dot.classList.add("note-blue");
            } else {
              dot.classList.add("note-scale");
            }

            dot.textContent = noteName;
            cell.appendChild(dot);
          }

          el.appendChild(cell);
        }
      }
    }

    populateRoots();

    [rootSelect, scaleSelect, cagedSelect, chordSelect, tuningSelect].forEach(el => {
      el.addEventListener("change", render);
    });

    render();
  </script>
